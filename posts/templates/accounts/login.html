{% extends 'posts/base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f8f9fa;">
    <h2 style="text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold;">Ingresar</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
        ¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate acá</a>
    </p>
</div>
{% endblock %}
