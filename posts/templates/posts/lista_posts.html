{% extends 'posts/base.html' %}

{% block content %}
<div class="contenedor-blog">
    <h1>Publicaciones del Blog</h1>

    {% for post in posts %}
        <article class="post-card">
            <!-- Título dinámico -->
            <h2>{{ post.titulo }}</h2>
            
            <!-- Datos adicionales opcionales para complementar -->
            <p class="meta">Por: {{ post.autor }} | {{ post.fecha_creacion|date:"d/m/Y" }}</p>
            
            <!-- Contenido dinámico -->
            <div class="contenido">
                {{ post.contenido }}
            </div>
        </article>
    {% empty %}
        <p>No hay posts publicados actualmente.</p>
    {% endfor %}
</div>
{% endblock %}
