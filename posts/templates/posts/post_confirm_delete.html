{% extends 'posts/base.html' %}

{% block content %}
<h2>⚠️ ¿Estás seguro de que querés eliminar esta publicación?</h2>
<p>Esta acción es definitiva y no se puede deshacer. Se eliminará el post: <strong>{{ post.titulo }}</strong></p>

<form method="post" style="margin-top: 20px;">
    {% csrf_token %}
    <button type="submit" style="background-color: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">
        Sí, confirmar eliminación
    </button>
    <a href="{% url 'lista_posts' %}" style="margin-left: 15px;">Cancelar y volver</a>
</form>
{% endblock %}
